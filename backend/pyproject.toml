[project]
name = "backend"
version = "0.1.0"
description = "Backend project with Torch and FastAPI"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.21",
    "requests>=2.32.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "scipy>=1.15.3",
    "opencv-python>=4.12.0.88",
    "onnxruntime-gpu>=1.23.2",
    "onnx>=1.20.0",
    "numba>=0.63.1",
    "torch",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest >=9.0.2",
    "ipython >=8.38.0"
]
